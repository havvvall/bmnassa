<style>
/* Layout: the whole phone screen is the card; front = identity + actions, back = contacts + QR; colour sheet slides up inside the card. Single dark brand world. */
:root{
  --ink:#06090b; --teal:#1fc6c0; --coral:#f0806a;
  --card:#0b1014; --cfg:#f4f6f7; --csoft:rgba(244,246,247,.66); --cline:rgba(244,246,247,.16); --cglass:rgba(244,246,247,.08); --cline2:rgba(244,246,247,.38);
  --bbg:#ffffff; --bfg:#0b1014;
  --f-ui:'Manrope','Helvetica Neue',Arial,sans-serif; --f-kufi:'Noto Kufi Arabic','Manrope',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.qr{display:block!important}
.qr>svg{width:100%!important;height:100%!important;display:block}
html,body{height:100%;background:var(--ink)}
body{margin:0;color:var(--cfg);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;justify-content:center}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] a{font-family:var(--f-kufi)}
.scene{width:100%;max-width:440px;height:100%;min-height:600px;perspective:2000px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);color:var(--cfg);
  box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.07);transition:background .5s,color .5s;
  display:flex;flex-direction:column;padding:18px 20px 20px}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 55% at 0% 0%,rgba(255,255,255,.17),transparent 60%),radial-gradient(80% 50% at 100% 100%,rgba(0,0,0,.25),transparent 60%),repeating-linear-gradient(118deg,rgba(255,255,255,.022) 0 2px,transparent 2px 7px)}
.face::after{content:"";position:absolute;inset:-30%;pointer-events:none;background:linear-gradient(105deg,transparent 44%,rgba(255,255,255,.1) 50%,transparent 56%);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,45%{transform:translateX(-55%)}85%,100%{transform:translateX(55%)}}
.face>*{position:relative;z-index:1}
.back{transform:rotateY(180deg)}
.card.flip .front,.card:not(.flip) .back{pointer-events:none}
.edge{position:absolute!important;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--teal),var(--coral))}
.logo path{fill:currentColor}

/* top bar inside card */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.langs{direction:ltr;position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:99px;background:var(--cglass);border:1px solid var(--cline);width:164px}
.langs .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:99px;background:var(--bbg);transition:transform .4s cubic-bezier(.3,1.3,.5,1),background .5s}
.langs button{position:relative;z-index:1;height:30px;border:0;background:none;color:var(--csoft);font-weight:800;font-size:12px;cursor:pointer;border-radius:99px}
.langs button[aria-pressed=true]{color:var(--bfg)}
.langs button[lang=ckb],.langs button[lang=ar]{font-family:var(--f-kufi)}
.tools{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--cline);background:var(--cglass);color:var(--cfg);display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ib.dot{position:relative}
.ib.dot::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;right:-1px;top:-1px;background:conic-gradient(#1fc6c0,#f0806a,#e7dfd1,#1b2a4a,#1fc6c0);border:2px solid var(--card)}

/* front identity */
.id{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:10px 4px}
.chiprow{display:flex;align-items:center;gap:12px}
.mono{width:72px;height:72px;border-radius:22px;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;font-size:26px;letter-spacing:.02em}
.nfc{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--cglass);border:1px solid var(--cline);font-size:12px;font-weight:700;color:var(--csoft)}
.nfc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.nm{font-size:clamp(34px,10.5vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
[dir=rtl] .nm{letter-spacing:0;line-height:1.35}
.rl{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--csoft)}
[dir=rtl] .rl{letter-spacing:0}
.loc{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--csoft)}
.loc svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* actions */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.act{display:grid;justify-items:center;gap:7px;text-decoration:none;color:var(--cfg);font-size:12px;font-weight:700;background:none;border:0;padding:0;cursor:pointer}
.act i{width:100%;max-width:64px;aspect-ratio:1;border-radius:20px;background:var(--bbg);color:var(--bfg);display:grid;place-items:center;box-shadow:0 10px 22px rgba(0,0,0,.3);transition:background .5s,color .5s}
.act svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.full{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px;border-radius:20px;background:var(--bbg);color:var(--bfg);text-decoration:none;box-shadow:0 12px 26px rgba(0,0,0,.32);transition:background .5s,color .5s}
.full div{flex:1;min-width:0}.full b{display:block;font-size:16px;font-weight:800}.full small{font-size:12px;font-weight:600;opacity:.65}
.full svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .full .arr{transform:scaleX(-1)}
.sig{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--csoft);text-transform:uppercase}
[dir=rtl] .sig{letter-spacing:0}
.sig .logo{width:74px;height:auto;color:var(--cfg)}

/* back */
.qrwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 0}
.qr{width:min(58vw,230px);aspect-ratio:1;background:#fff;border-radius:24px;padding:14px;display:grid;place-items:center;box-shadow:0 16px 34px rgba(0,0,0,.35)}
.qr svg{width:100%;height:auto;display:block}
.qr canvas,.qr img{width:100%!important;height:auto!important;display:block}
.qrwrap small{font-size:13px;font-weight:700;color:var(--csoft)}
.list{list-style:none;margin:0 0 14px;padding:0;border-radius:20px;border:1px solid var(--cline);background:var(--cglass);overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--cline);min-width:0}
.list li:first-child{border-top:0}
.list svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.list div{display:grid;gap:1px;min-width:0}
.list small{font-size:11px;font-weight:700;color:var(--csoft);letter-spacing:.06em;text-transform:uppercase}
[dir=rtl] .list small{letter-spacing:0}
.list b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .ltr{direction:ltr;unicode-bidi:isolate}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:18px;border:0;background:var(--bbg);color:var(--bfg);font:inherit;font-size:14.5px;font-weight:800;text-decoration:none;cursor:pointer;transition:background .5s,color .5s}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* colour sheet */
.sheet{position:absolute!important;left:10px;right:10px;bottom:10px;z-index:5!important;border-radius:24px;padding:16px;background:rgba(10,14,17,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:#f4f6f7;
  transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:grid;gap:12px}
.sheet.open{transform:none}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}
.sheet .hd button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:16px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;justify-items:center}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.22);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px #0a0e11,0 0 0 5px #fff}
.sw label{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed rgba(255,255,255,.4);cursor:pointer;position:relative;overflow:hidden}
.sw input[type=color]{position:absolute;inset:-8px;width:60px;height:60px;border:0;padding:0;opacity:0;cursor:pointer}
.sw label span{font-size:20px;font-weight:700;color:#fff;pointer-events:none}
.sheet small{font-size:12px;color:#8b979d;font-weight:600}
@media (prefers-reduced-motion:reduce){.card{transition:none}.face::after{animation:none}}
/* transparent buttons: outline only, no fill */
.act i,.full,.btn{background:transparent!important;color:var(--cfg)!important;box-shadow:none!important;border:1.5px solid var(--cline2)!important}
.act i{backdrop-filter:none}
.act:active i,.full:active,.btn:active{background:var(--cglass)!important}
.full small{opacity:.7}
/* iOS Safari: hide the far side halfway through the flip (backface-visibility alone leaks on iPhone) */
.front{visibility:visible;transition:visibility 0s linear .45s,background .5s,color .5s}
.back{visibility:hidden;transition:visibility 0s linear .45s,background .5s,color .5s}
.card.flip .front{visibility:hidden}
.card.flip .back{visibility:visible}
.face,.face *{-webkit-backface-visibility:hidden;backface-visibility:hidden}
a[href^="tel"],.list b{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){.front,.back{transition:none}}
</style>

  };
  const COLORS = [['Midnight','#0b1014'],['Teal','#0f6f78'],['Coral','#d9674f'],['Navy','#1b2a4a'],['Forest','#1f4d3a'],['Burgundy','#6b1f2e'],['Plum','#3b2350'],['Sand','#e7dfd1'],['Pearl','#f4f6f7']];
  let lang = 'en';
  const $ = id => document.getElementById(id), card = $('card'), sheet = $('sheet'), R = document.documentElement.style;
  function lum(hex){ const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
  function paint(hex){
    const light = lum(hex) > .45;
    R.setProperty('--card', hex);
    R.setProperty('--cfg', light ? '#0b1014' : '#f4f6f7');
    R.setProperty('--csoft', light ? 'rgba(11,16,20,.62)' : 'rgba(244,246,247,.66)');
    R.setProperty('--cline', light ? 'rgba(11,16,20,.14)' : 'rgba(244,246,247,.16)');
    R.setProperty('--cglass', light ? 'rgba(11,16,20,.05)' : 'rgba(244,246,247,.08)'); R.setProperty('--cline2', light ? 'rgba(11,16,20,.34)' : 'rgba(244,246,247,.38)');

    try { localStorage.setItem('bm-full-color', hex); } catch (e) {}
  }
  function render(){
    const t = T[lang], h = document.documentElement;
    h.lang = lang === 'ku' ? 'ckb' : lang; h.dir = lang === 'en' ? 'ltr' : 'rtl';

  }
  $('sw').innerHTML = COLORS.map(([n, c]) => `<button type="button" data-c="${c}" aria-label="${n}" title="${n}" style="background:${c}"></button>`).join('') +
    `<label title="Custom"><input type="color" id="custom" value="#5b3fd1" aria-label="Custom colour"><span>+</span></label>`;
  $('sw').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) paint(b.dataset.c); });
  $('custom').addEventListener('input', e => paint(e.target.value));
  document.querySelectorAll('[data-flip]').forEach(b => b.addEventListener('click', () => { sheet.classList.remove('open'); card.classList.toggle('flip'); }));
  document.querySelectorAll('[data-open=colors]').forEach(b => b.addEventListener('click', () => sheet.classList.toggle('open')));
  $('closeSheet').addEventListener('click', () => sheet.classList.remove('open'));
  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));
  const CARD_COLOR = '#0b1014';            // owner's chosen colour (visitors always see this)

  if (!OWNER) document.querySelectorAll('[data-open=colors]').forEach(b => b.hidden = true);
  let saved = null; if (OWNER) { try { saved = localStorage.getItem('bm-full-color'); } catch (e) {} }
  paint(saved || CARD_COLOR); render();
  document.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', () => {
    const vcf = ['BEGIN:VCARD','VERSION:3.0','N:Baban;Haval;;Eng.;','FN:Eng. Haval Baban','TITLE:Civil Engineer','TEL;TYPE=CELL:+9647701218832','EMAIL;TYPE=INTERNET:haval.rizgar96@gmail.com','ADR;TYPE=WORK:;;Bakhtiyari;Sulaymaniyah;;;Iraq','URL:https://bmnassa.vercel.app/eng.haval-baban','NOTE:Saved from a Bmnassa digital card','END:VCARD'].join('\r\n');
    const url = URL.createObjectURL(new Blob([vcf], {type: 'text/vcard'}));
    const a = document.createElement('a'); a.href = url; a.download = 'Haval-Baban.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }));
})();
</script>
