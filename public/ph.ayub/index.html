<style>
/* Layout: one phone-width column on the drifting teal/coral field; gallery, price list and "send my number" open as bottom sheets; EN / Kurdish / Arabic switch on top. One dark look on purpose. */
:root{
  --ink:#0b1014; --teal:#1fc6c0; --teal-deep:#0f6f78; --coral:#f0806a;
  --fg:#f4f6f7; --soft:#c9d1d5; --muted:#8b979d; --dim:#5d686e; --gold:#f4c46a;
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.06);
  --grad:linear-gradient(120deg,var(--teal),var(--coral));
  --font:'Manrope', 'Helvetica Neue', Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:16px 28px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
html[lang="ar"] body{font-family:'Alexandria','Noto Kufi Arabic','Manrope',sans-serif}
html[lang="ckb"] body{font-family:'Vazirmatn','Noto Kufi Arabic','Manrope',sans-serif}
.langs button[lang="ar"]{font-family:'Alexandria','Noto Kufi Arabic',sans-serif}
.langs button[lang="ckb"]{font-family:'Vazirmatn','Noto Kufi Arabic',sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .chev{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}

.field{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blob{position:absolute;filter:blur(50px)}
.blob.t{width:120vw;height:55vh;left:-45vw;top:-22vh;background:radial-gradient(closest-side,var(--teal-deep),rgba(15,111,120,.5) 60%,transparent);animation:dA 16s ease-in-out infinite alternate}
.blob.c{width:120vw;height:55vh;right:-50vw;bottom:-24vh;background:radial-gradient(closest-side,var(--coral),rgba(185,87,63,.5) 60%,transparent);opacity:.75;animation:dB 18s ease-in-out infinite alternate}
@keyframes dA{to{transform:translate(10vw,6vh) rotate(14deg)}}
@keyframes dB{to{transform:translate(-12vw,-6vh) rotate(-12deg)}}

.page{max-width:400px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .22s ease,filter .22s ease,transform .22s ease}
.page.swap{opacity:0;filter:blur(8px);transform:translateY(6px)}
.page>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* language switch */
.langs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:228px;padding:4px;border-radius:99px;background:rgba(16,22,27,.7);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);direction:ltr}
.langs .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:var(--grad);box-shadow:0 4px 18px rgba(31,198,192,.35);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.langs button{position:relative;z-index:1;height:34px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:800;color:var(--soft);border-radius:99px;transition:color .3s}
.langs button[aria-pressed="true"]{color:#081416}

.tapped{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--soft)}
.tapped svg{width:16px;height:16px;color:var(--teal);stroke-width:2}

.orbit{position:relative;width:200px;height:200px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.11)}
.ring.r2{inset:18px;border-color:rgba(255,255,255,.08)}
.spin{position:absolute;inset:0;animation:spin 16s linear infinite}
.spin.s2{inset:18px;animation-duration:24s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{position:absolute;border-radius:50%}
.dot.t{background:var(--teal);box-shadow:0 0 14px var(--teal)}
.dot.c{background:var(--coral);box-shadow:0 0 14px var(--coral)}
.avatar{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.15),rgba(255,255,255,.03) 65%),#172026;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 60px rgba(255,255,255,.06);animation:breathe 5s ease-in-out infinite}
.avatar svg{width:86px;height:auto;filter:drop-shadow(0 0 8px rgba(255,255,255,.25))}
@keyframes breathe{50%{box-shadow:0 0 70px 6px rgba(255,255,255,.1)}}
.logo path{fill:var(--fg)}

.who{display:grid;justify-items:center;gap:4px;text-align:center}
.who .nm{display:flex;align-items:center;gap:8px;font-size:27px;font-weight:800;letter-spacing:-.02em}
[dir="rtl"] .who .nm{letter-spacing:0}
.who .role{font-size:14px;color:var(--soft);font-weight:600}
.tick{width:21px;height:21px;border-radius:50%;background:var(--teal);color:#062022;display:grid;place-items:center;flex:none}
.tick svg{width:12px;height:12px;stroke-width:3.2}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:700}
.chip.ver{color:#7fe3df}
.chip.ver svg{width:14px;height:14px;stroke-width:2.2}
.chip.rate svg{width:13px;height:13px;fill:var(--gold);stroke:var(--gold)}
.chip.open{background:rgba(31,198,192,.12);border-color:rgba(31,198,192,.4);color:#7fe3df}
.chip.closed{background:rgba(240,128,106,.12);border-color:rgba(240,128,106,.4);color:#f6a998}
.chip .pip{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.tiles{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{height:96px;border-radius:22px;background:var(--glass);border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px;transition:transform .2s,background .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);min-width:0}
.tile:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.tile:active{transform:scale(.97)}
.tile svg{width:24px;height:24px;color:var(--teal)}
.tile b{display:block;font-size:15px}
.tile small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.primary{background:var(--teal);border-color:var(--teal);color:#062022}
.tile.primary svg{color:#062022}
.tile.primary small{color:#0b3b3c}

.sec{width:100%;display:flex;flex-direction:column;gap:8px}
.lab{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
[dir="rtl"] .lab{letter-spacing:0;font-size:12.5px}
.about{margin:0;font-size:14px;line-height:1.7;color:var(--soft)}

.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:64px;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-align:start;cursor:pointer;width:100%;transition:background .2s}
.row:hover{background:rgba(255,255,255,.09)}
.row .txt{flex:1;min-width:0;display:grid;gap:1px}
.row b{font-size:15px}
.row small{font-size:12.5px;color:var(--muted);font-weight:600}
.row .chev{width:18px;height:18px;color:var(--dim);stroke-width:2}
.photos{flex-direction:column;align-items:stretch;gap:12px;padding:14px 16px}
.photos .head{display:flex;align-items:center;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumbs>span{aspect-ratio:1;border-radius:10px;border:1px solid rgba(255,255,255,.08);overflow:hidden;display:block}
.thumbs svg{display:block;width:100%;height:100%}
.thumbs .more{display:grid;place-items:center;background:var(--glass);font-size:13px;font-weight:800;color:var(--soft)}

.box{border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);padding:2px 16px;display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);font-weight:600;flex:none}
.kv span:last-child{font-weight:700;text-align:end;min-width:0;overflow-wrap:anywhere}
.hours{padding:6px 8px;font-size:13.5px}
.hr{display:flex;justify-content:space-between;padding:9px 10px;border-radius:12px;color:var(--soft);font-weight:600}
.hr .t{font-variant-numeric:tabular-nums}
.hr.today{background:rgba(31,198,192,.12);color:var(--fg);font-weight:800}
.hr.off{color:var(--muted)}
.hrhead{display:flex;justify-content:space-between;align-items:center}
.hrhead .state{font-size:12px;font-weight:700}

.socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.soc{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer;transition:transform .2s,border-color .2s}
.soc:hover{transform:translateY(-2px);border-color:rgba(31,198,192,.5)}
.soc svg{width:20px;height:20px}

.save{width:100%;height:56px;border-radius:18px;border:0;background:var(--grad);color:#081416;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;margin-top:4px}
.save svg{width:20px;height:20px;stroke-width:2}
.save:active{transform:scale(.98)}
.linkbtn{background:none;border:0;font-size:13px;font-weight:700;color:var(--soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.powered{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);text-decoration:none;margin-top:8px}
.powered span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.16em}
[dir="rtl"] .powered span{letter-spacing:0;font-size:12px}
.powered svg{width:66px;height:27px}
.sample{font-size:11.5px;color:var(--dim);text-align:center;margin:0}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,8,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,430px);max-height:86vh;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.85,.25,1);z-index:21;background:#11181d;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:10px auto 4px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px 12px}
.shead h2{margin:0;font-size:19px;font-weight:800}
.shead small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:18px;height:18px;stroke-width:2}
.sbody{overflow-y:auto;padding:4px 20px 22px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.grab,.shead,.filters{flex:none}
.sbody{flex:1;min-height:0}
.f{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:12.5px;font-weight:700;cursor:pointer}
.f[aria-pressed="true"]{background:var(--fg);color:#0b1014;border-color:var(--fg)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid rgba(255,255,255,.08);cursor:pointer;overflow:hidden;padding:0;display:block;background:#1a2226;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.ph svg{display:block;width:100%;height:100%}
.ph .cap{position:absolute;inset-inline:0;bottom:0;padding:16px 6px 5px;font-size:10px;font-weight:700;color:#fff;text-align:start;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.prices{display:flex;flex-direction:column}
.pr{display:flex;align-items:baseline;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.pr:last-child{border-bottom:0}
.pr .n{flex:1;min-width:0}
.pr .n b{display:block;font-size:14.5px}
.pr .n small{color:var(--muted);font-size:12px;font-weight:600}
.pr .p{font-weight:800;font-size:14.5px;white-space:nowrap;text-align:end}
.pr .p em{font-style:normal;color:var(--muted);font-size:11.5px;font-weight:700}
.pcat{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--teal);margin:14px 0 2px}
[dir="rtl"] .pcat{letter-spacing:0;font-size:12.5px}
.pcat:first-child{margin-top:0}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:14px 0 0}
.form{display:grid;gap:12px}
.form label{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.form input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:0 14px;font-size:16px;outline:none}
.form input:focus{border-color:rgba(31,198,192,.55);box-shadow:0 0 0 4px rgba(31,198,192,.1)}

.lightbox{position:fixed;inset:0;z-index:30;background:rgba(5,8,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox .big{width:min(100%,400px);aspect-ratio:1;border-radius:20px;border:1px solid var(--line);overflow:hidden}
.lightbox .big svg{display:block;width:100%;height:100%}
.lightbox .cap{text-align:center;display:grid;gap:3px}
.lightbox .cap b{font-size:16px}
.lightbox .cap small{color:var(--muted);font-size:13px}
.lbnav{display:flex;gap:12px;direction:ltr}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:11px 18px;border-radius:99px;background:rgba(20,28,33,.95);border:1px solid var(--line);font-size:13px;font-weight:700;transition:.3s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  </div>

  <div class="who">
    <div class="nm"><span data-t="name"></span> <span class="tick" aria-label="Verified"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
    <div class="role" data-t="role"></div>
  </div>

  <div class="chips">
    <span class="chip ver"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span data-t="verified"></span></span>

  [{en:'Weight and BMI',ku:'کێش و BMI',ar:'الوزن ومؤشر الكتلة'},{en:'Digital scale and advice',ku:'تەرازووی دیجیتاڵ و ئامۆژگاری',ar:'ميزان رقمي ونصيحة'},0,'0','']]},
 {cat:{en:'Care services',ku:'خزمەتگوزاری چاودێری',ar:'خدمات الرعاية'}, items:[
  [{en:'Injection',ku:'دەرزی لێدان',ar:'زرق الإبر'},{en:'Bring your prescription',ku:'ڕەچەتەکەت لەگەڵ خۆت بهێنە',ar:'أحضر وصفتك'},0,'2,000',''],
  [{en:'Wound dressing',ku:'پێچانەوەی برین',ar:'تضميد الجروح'},{en:'Small cuts and burns',ku:'برینی بچووک و سووتان',ar:'جروح وحروق بسيطة'},1,'3,000',''],
  [{en:'Nebulizer session',ku:'هەڵمژینی نێبیولایزەر',ar:'جلسة بخار (نيبولايزر)'},{en:'With your own mask or ours',ku:'بە دەمامکی خۆت یان ئێمە',ar:'بقناعك أو قناعنا'},0,'3,000','']]},
 {cat:{en:'Orders and delivery',ku:'داواکاری و گەیاندن',ar:'الطلبات والتوصيل'}, items:[
  [{en:'Home delivery in Kirkuk',ku:'گەیاندن بۆ ماڵ لە کەرکووک',ar:'توصيل للمنزل داخل كركوك'},{en:'Depends on the area',ku:'بەپێی ناوچە',ar:'حسب المنطقة'},1,'2,000',''],
  [{en:'Prescription by WhatsApp',ku:'ناردنی ڕەچەتە بە واتساپ',ar:'إرسال الوصفة عبر واتساب'},{en:'We prepare it before you arrive',ku:'پێش گەیشتنت ئامادەی دەکەین',ar:'نجهزها قبل وصولك'},0,'0','']]}
];

/* ---------- illustrated pharmacy images (drawn, random but repeatable) ---------- */
function rng(seed){ let a = seed * 2654435761 >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
const BOX = ['#e8eef2','#f2dcd2','#d6ece6','#f4e7c4','#dfe3f4','#f6d4d4','#cfe6f2','#fff','#e9d9f0','#d9efd6'];
function cross(x, y, s, glow){ const w = s / 3; return `${glow ? `<circle cx="${x}" cy="${y}" r="${s}" fill="#3ddc84" opacity=".28"/>` : ''}<rect x="${x - w / 2}" y="${y - s / 2}" width="${w}" height="${s}" rx="2" fill="#22c35e"/><rect x="${x - s / 2}" y="${y - w / 2}" width="${s}" height="${w}" rx="2" fill="#22c35e"/>`; }
function shelfRow(r, x, y, w, h){
  let s = '', cx = x + 3;
  while (cx < x + w - 10){
    const bw = 8 + r() * 14, bh = h * (.5 + r() * .45), c = pick(r, BOX);
    if (r() > .75){ s += `<rect x="${cx}" y="${y - bh}" width="${bw * .7}" height="${bh}" rx="3" fill="${pick(r, ['#c9a46a','#7fb3c9','#e4e4e4','#9cc9a3'])}"/><rect x="${cx + bw * .15}" y="${y - bh - 4}" width="${bw * .4}" height="5" rx="1" fill="#555"/>`; cx += bw * .7 + 2; continue; }
    s += `<rect x="${cx}" y="${y - bh}" width="${bw}" height="${bh}" rx="1" fill="${c}"/><rect x="${cx}" y="${y - bh + bh * .3}" width="${bw}" height="${bh * .18}" fill="${pick(r, ['#1fc6c0','#f0806a','#5b8def','#22c35e','#c94f6d','#e3a33a'])}" opacity=".75"/>`;
    cx += bw + 2;
  }
  return s;
}
function front(seed){
  const r = rng(seed), night = r() > .55, id = 'f' + seed;
  let s = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${night ? '#1b3446' : '#9fc4dc'}"/><stop offset="1" stop-color="${night ? '#d9876a' : '#ece4d6'}"/></linearGradient></defs><rect width="300" height="300" fill="url(#${id})"/>`;
  const wall = pick(r, ['#e2d9c8','#d6cbb6','#c9bfae','#e8e3da']);
  s += `<rect x="0" y="40" width="300" height="210" fill="${wall}"/><rect x="0" y="40" width="300" height="8" fill="#b8ad99"/>`;
  s += `<rect x="20" y="62" width="260" height="34" rx="4" fill="#123a3c"/>${cross(46, 79, 20, night)}`;
  for (let k = 0; k < 9; k++) s += `<rect x="${72 + k * 22}" y="${73 + (k % 2) * 2}" width="16" height="10" rx="2" fill="#e8f6f4" opacity="${.85 - (k % 3) * .15}"/>`;
  s += `<rect x="20" y="104" width="260" height="10" fill="${pick(r, ['#1fc6c0','#22c35e','#f0806a'])}" opacity=".85"/>`;
  s += `<rect x="24" y="118" width="150" height="114" fill="${night ? '#f6e7b8' : '#cfe3ea'}" opacity="${night ? .95 : .85}"/>`;
  for (let row = 0; row < 3; row++){ s += `<rect x="28" y="${148 + row * 30}" width="142" height="3" fill="#8a8a8a"/>` + shelfRow(r, 28, 148 + row * 30, 142, 24); }
  s += `<rect x="186" y="118" width="88" height="114" fill="${night ? '#f6e7b8' : '#b9d6e0'}" opacity=".9"/><rect x="228" y="118" width="3" height="114" fill="#6b6b6b"/><rect x="186" y="118" width="88" height="114" fill="none" stroke="#5a5a5a" stroke-width="4"/>`;
  s += `<rect x="208" y="170" width="3" height="16" fill="#555"/><rect x="246" y="170" width="3" height="16" fill="#555"/>`;
  s += `<rect x="0" y="232" width="300" height="68" fill="${night ? '#3a3a3c' : '#9b9384'}"/><rect x="0" y="232" width="300" height="5" fill="${night ? '#4a4a4c' : '#b4ab9b'}"/>`;
  s += `<rect x="286" y="60" width="4" height="172" fill="#555"/>${cross(288, 52, 18, true)}`;
  return s + '</svg>';
}
function shelves(seed){
  const r = rng(seed);
  let s = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="${pick(r, ['#f3f1ec','#eef2f1','#f4efe8'])}"/>`;
  s += `<rect x="0" y="0" width="300" height="22" fill="#e1ddd5"/>`;
  for (let k = 0; k < 4; k++) s += `<rect x="${30 + k * 72}" y="6" width="44" height="6" rx="3" fill="#fffbe8"/>`;
  s += `<rect x="10" y="30" width="280" height="236" fill="${pick(r, ['#d9cdb8','#cdd7d6','#e2d6c4'])}"/>`;
  const rows = 5, rh = 236 / rows;
  for (let i = 0; i < rows; i++){ const y = 30 + (i + 1) * rh; s += shelfRow(r, 14, y - 3, 272, rh - 8) + `<rect x="10" y="${y - 3}" width="280" height="5" fill="#9b8f7b"/>`; }
  s += `<rect x="146" y="30" width="6" height="236" fill="#b8ab95"/>`;
  s += `<rect x="0" y="266" width="300" height="34" fill="${pick(r, ['#cfc6b8','#bdb3a3','#d8d2c8'])}"/>`;
  if (r() > .5) s += cross(270, 44, 16, false);
  return s + '</svg>';
}
function counter(seed){
  const r = rng(seed);
  let s = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="300" fill="${pick(r, ['#eef2f1','#f3f1ec','#e9eef3'])}"/>`;
  s += `<rect x="0" y="20" width="300" height="140" fill="${pick(r, ['#d6ddd9','#ddd5c7'])}"/>`;
  for (let i = 0; i < 3; i++){ const y = 20 + (i + 1) * 46; s += shelfRow(r, 4, y - 3, 292, 38) + `<rect x="0" y="${y - 3}" width="300" height="4" fill="#9b8f7b"/>`; }
  s += `<rect x="0" y="160" width="300" height="140" fill="#cfc6b8"/>`;
  s += `<rect x="20" y="176" width="260" height="14" rx="3" fill="${pick(r, ['#f4f6f7','#e8e4dc'])}"/><rect x="26" y="190" width="248" height="90" fill="${pick(r, ['#1d5e5a','#2f4b5c','#5b4636'])}"/>`;
  s += cross(150, 236, 30, false);
  s += `<path d="M60 176 L64 148 L96 148 L100 176 Z" fill="#fff" stroke="#d8d8d8"/><rect x="74" y="142" width="12" height="10" rx="5" fill="none" stroke="#bbb" stroke-width="2"/>${cross(80, 162, 10, false)}`;
  s += `<rect x="196" y="156" width="14" height="20" rx="3" fill="#c9a46a"/><rect x="198" y="151" width="10" height="6" fill="#fff"/><rect x="214" y="160" width="12" height="16" rx="3" fill="#7fb3c9"/><rect x="216" y="155" width="8" height="6" fill="#fff"/>`;
  s += `<rect x="236" y="164" width="22" height="12" rx="2" fill="#333"/><rect x="240" y="166" width="14" height="5" fill="#7fe3df"/>`;
  return s + '</svg>';
}
const DRAW = {front: front, shelves: shelves, counter: counter};
const mixR = rng(7121);
const POOL = [].concat(Array(4).fill('front'), Array(5).fill('shelves'), Array(3).fill('counter'));
for (let i = POOL.length - 1; i > 0; i--){ const j = Math.floor(mixR() * (i + 1)); [POOL[i], POOL[j]] = [POOL[j], POOL[i]]; }
const counters = {front:0, shelves:0, counter:0};
const PHOTOS = POOL.map((kind, i) => { const n = counters[kind]++; return {kind, cap: n, svg: DRAW[kind](500 + i * 11)}; });

/* ---------- language ---------- */
let lang = 'en', sheetOpen = null;
try { const saved = localStorage.getItem('bmnassa-card-lang'); if (T[saved]) lang = saved; } catch (e) {}
const L = () => T[lang];

function applyText(){
  const t = L();
  document.documentElement.lang = lang === 'ku' ? 'ckb' : lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  $('yName').placeholder = t.namePh;
  $('photoCount').textContent = t.photoCount(PHOTOS.length);
  document.querySelectorAll('.langs button').forEach((b, i) => { const on = b.dataset.lang === lang; b.setAttribute('aria-pressed', on); if (on) $('langThumb').style.transform = `translateX(${i * 100}%)`; });
  renderHours(); renderPrices(); if (sheetOpen === 'sheetPhotos') renderGallery();
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang; try { localStorage.setItem('bmnassa-card-lang', lang); } catch (e) {}
  const page = $('page'); page.classList.add('swap');
  setTimeout(() => { applyText(); page.classList.remove('swap'); }, 220);
}));

/* ---------- gallery ---------- */
$('thumbs').innerHTML = PHOTOS.slice(0, 3).map(p => `<span>${p.svg}</span>`).join('') + `<span class="more">+${PHOTOS.length - 3}</span>`;
let filter = 'all', shown = PHOTOS, lbIndex = 0;
const capOf = p => CAPS[p.kind][lang][p.cap % CAPS[p.kind][lang].length];
const subOf = p => L().cats[p.kind];
function renderGallery(){
  const t = L();
  $('filters').innerHTML = ['all', 'front', 'shelves', 'counter'].map(k => `<button class="f" type="button" aria-pressed="${k === filter}" data-f="${k}">${k === 'all' ? t.all : t.cats[k]}</button>`).join('');
  shown = filter === 'all' ? PHOTOS : PHOTOS.filter(p => p.kind === filter);
  $('gal').innerHTML = shown.map((p, i) => `<button class="ph" type="button" data-i="${i}" style="animation-delay:${i * 0.025}s" aria-label="${capOf(p)}">${p.svg}<span class="cap">${capOf(p)}</span></button>`).join('');
}
$('filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; renderGallery(); });
$('gal').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; openLb(+b.dataset.i); });
function openLb(i){ lbIndex = (i + shown.length) % shown.length; const p = shown[lbIndex]; $('lbImg').innerHTML = p.svg; $('lbCap').textContent = capOf(p); $('lbSub').textContent = subOf(p) + ' · ' + (lbIndex + 1) + ' ' + L().of + ' ' + shown.length; $('lightbox').classList.add('on'); }
$('lbPrev').onclick = () => openLb(lbIndex - 1);
$('lbNext').onclick = () => openLb(lbIndex + 1);
$('lbClose').onclick = () => $('lightbox').classList.remove('on');

/* ---------- prices ---------- */
function renderPrices(){
  const t = L();
  $('prices').innerHTML = PRICES.map(g => `<div class="pcat">${g.cat[lang].toUpperCase()}</div>` + g.items.map(([n, d, f, p, u]) =>
    `<div class="pr"><div class="n"><b>${n[lang]}</b><small>${d[lang]}</small></div><div class="p">${p === '0' ? t.free : `${f ? `<em>${t.from}</em> ` : ''}<span class="ltr">${p}</span> ${t.iqd}`}</div></div>`).join('')).join('');
}

/* ---------- opening hours (Kurdistan week, Friday off) ---------- */
const HOURS = [[9,22],[9,22],[9,22],[9,22],[9,22],[9,22],[16,22]];
const jsToRow = [1, 2, 3, 4, 5, 6, 0];
function renderHours(){
  const t = L(), now = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Baghdad'})), today = jsToRow[now.getDay()], h = now.getHours() + now.getMinutes() / 60;
  const fmt = x => x + ':00';
  $('hours').innerHTML = HOURS.map((o, i) => `<div class="hr ${i === today ? 'today' : ''} ${o ? '' : 'off'}"><span>${t.days[i]}${i === today ? ' · ' + t.today : ''}</span><span class="t ltr">${o ? fmt(o[0]) + ' – ' + fmt(o[1]) : t.closed}</span></div>`).join('');
  const o = HOURS[today], isOpen = o && h >= o[0] && h < o[1];
  if (isOpen){ $('openChip').className = 'chip open'; $('openText').textContent = t.openUntil(fmt(o[1])); $('hrState').textContent = t.openNow; $('hrState').style.color = '#7fe3df'; }
  else {
    $('openChip').className = 'chip closed';
    if (o && h < o[0]) $('openText').textContent = t.opensToday(fmt(o[0]));
    else { let n = 1; while (!HOURS[(today + n) % 7]) n++; const nx = HOURS[(today + n) % 7]; $('openText').textContent = n === 1 ? t.closedTomorrow(fmt(nx[0])) : t.closedDay(t.days[(today + n) % 7], fmt(nx[0])); }
    $('hrState').textContent = t.closedNow; $('hrState').style.color = '#f6a998';
  }
}

/* ---------- sheets & actions ---------- */
const scrim = $('scrim');
function show(id){ if (sheetOpen) $(sheetOpen).classList.remove('on'); sheetOpen = id; $(id).classList.add('on'); scrim.classList.add('on'); }
function hide(){ if (sheetOpen) $(sheetOpen).classList.remove('on'); sheetOpen = null; scrim.classList.remove('on'); }
$('openPhotos').onclick = () => { renderGallery(); show('sheetPhotos'); };
$('openPrices').onclick = () => show('sheetPrices');
$('sendNum').onclick = () => { show('sheetSend'); setTimeout(() => $('yName').focus(), 350); };
scrim.onclick = hide;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = hide);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('lightbox').classList.contains('on')) $('lightbox').classList.remove('on'); else hide(); });
const LIVE = true, CARD_URL = 'https://bmnassa.vercel.app/ph.ayub';
function openLink(href){ const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
$('rxBtn').onclick = () => openLink('https://wa.me/9647713291455?text=' + encodeURIComponent(L().rxText));
$('quoteBtn').onclick = () => openLink('https://wa.me/9647713291455?text=' + encodeURIComponent(L().waText));
$('sendForm').addEventListener('submit', e => {
  e.preventDefault(); const n = $('yName').value.trim(), p = $('yPhone').value.trim();
  hide(); e.target.reset();
  if (LIVE) openLink('https://wa.me/9647713291455?text=' + encodeURIComponent(L().myNum(n, p))); else toast(L().tSent);
});
$('saveBtn').onclick = () => {
  if (!LIVE) { toast(L().tSaved); return; }
  const vcf = ['BEGIN:VCARD','VERSION:3.0','N:Kareem;Ayub;O.;Ph.;','FN:Ph. Ayub O. Kareem','TITLE:Pharmacist','TEL;TYPE=CELL:+9647713291455','ADR;TYPE=WORK:;;Al Jumhuriyah St.;Kirkuk;;;Iraq','URL:' + CARD_URL,'NOTE:Saved from a Bmnassa digital card','END:VCARD'].join('\r\n');
  const url = URL.createObjectURL(new Blob([vcf], {type: 'text/vcard'}));
  const a = document.createElement('a'); a.href = url; a.download = 'Ayub-Kareem.vcf'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
};
$('shareBtn').onclick = async () => {
  if (LIVE && navigator.share) { try { await navigator.share({title: L().shareTitle, url: CARD_URL}); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  const url = LIVE ? CARD_URL : 'https://bmnassa.vercel.app';
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast(L().tCopied), () => toast(L().tShare)); else toast(L().tShare);
};
if (LIVE) $('page').querySelector('.sample').hidden = true;
let tt; function toast(m){ const x = $('toast'); x.textContent = m; x.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => x.classList.remove('on'), 2400); }

applyText();
})();
</script>
