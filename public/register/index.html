<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1014">
<title>List your business · Bmnassa</title>
<meta name="description" content="List your business on Bmnassa for free. Customers across Kurdistan find you, call you and message you on WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bmnassa.vercel.app/register">
<meta property="og:title" content="List your business on Bmnassa, free">
<meta property="og:description" content="Get found by customers in Erbil, Sulaymaniyah, Kirkuk, Duhok and Halabja. Takes 2 minutes.">
<meta property="og:image" content="https://bmnassa.vercel.app/register/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Alexandria:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column on the drifting teal/coral field. Hero, a live listing preview, then a four-step form in one glass panel. One dark look on purpose. */
:root{
  --ink:#0b1014; --teal:#1fc6c0; --teal-deep:#0f6f78; --coral:#f0806a;
  --fg:#f4f6f7; --soft:#c9d1d5; --muted:#8b979d; --dim:#5d686e; --err:#f6a998;
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.06);
  --grad:linear-gradient(120deg,var(--teal),var(--coral));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:'Manrope','Helvetica Neue',Arial,sans-serif;padding-inline:16px;padding-block:16px 32px;overflow-x:hidden}
html[lang="ar"] body{font-family:'Alexandria','Noto Kufi Arabic','Manrope',sans-serif}
html[lang="ckb"] body{font-family:'Vazirmatn','Noto Kufi Arabic','Manrope',sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

.field{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blob{position:absolute;filter:blur(50px)}
.blob.t{width:120vw;height:55vh;left:-45vw;top:-22vh;background:radial-gradient(closest-side,var(--teal-deep),rgba(15,111,120,.5) 60%,transparent);animation:dA 16s ease-in-out infinite alternate}
.blob.c{width:120vw;height:55vh;right:-50vw;bottom:-24vh;background:radial-gradient(closest-side,var(--coral),rgba(185,87,63,.5) 60%,transparent);opacity:.7;animation:dB 18s ease-in-out infinite alternate}
@keyframes dA{to{transform:translate(10vw,6vh) rotate(14deg)}}
@keyframes dB{to{transform:translate(-12vw,-6vh) rotate(-12deg)}}

.page{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;transition:opacity .22s,filter .22s,transform .22s}
.page.swap{opacity:0;filter:blur(8px);transform:translateY(6px)}
.page>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo path{fill:var(--fg)}
.top .logo{width:92px;height:auto;display:block}
.langs{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:210px;padding:4px;border-radius:99px;background:rgba(16,22,27,.7);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);direction:ltr}
.langs .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:var(--grad);box-shadow:0 4px 18px rgba(31,198,192,.35);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.langs button{position:relative;z-index:1;height:32px;border:0;background:none;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--soft);border-radius:99px;transition:color .3s}
.langs button[aria-pressed="true"]{color:#081416}
.langs button[lang="ar"]{font-family:'Alexandria','Noto Kufi Arabic',sans-serif}
.langs button[lang="ckb"]{font-family:'Vazirmatn','Noto Kufi Arabic',sans-serif}

.hero{display:grid;gap:10px;padding-top:6px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--teal)}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:13px}
.hero h1{margin:0;font-size:31px;line-height:1.12;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.35;font-size:28px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--soft);font-size:15px;line-height:1.6}
.perks{display:flex;gap:8px;flex-wrap:wrap}
.perk{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.perk svg{width:15px;height:15px;color:var(--teal);stroke-width:2.2}

/* live preview */
.preview{position:relative;border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;background:rgba(16,22,27,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
.preview::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1.3px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.preview .tag{position:absolute;top:10px;inset-inline-end:12px;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;gap:6px}
[dir="rtl"] .preview .tag{letter-spacing:0;font-size:11px}
.preview .tag i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.orb{position:relative;width:76px;height:76px;flex:none;display:grid;place-items:center}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.orb .spin{position:absolute;inset:0;animation:spin 10s linear infinite}
.orb .d{position:absolute;border-radius:50%}
.orb .d.t{left:34px;top:-4px;width:8px;height:8px;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.orb .d.c{left:35px;bottom:-3px;width:6px;height:6px;background:var(--coral);box-shadow:0 0 10px var(--coral)}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .core{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.15),rgba(255,255,255,.03) 65%),#172026;border:1px solid rgba(255,255,255,.18);font-size:19px;font-weight:800;color:#d7dde0}
.orb .core svg{width:40px;height:auto}
.pv{flex:1;min-width:0;display:grid;gap:3px;padding-top:6px}
.pv b{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv b.ph{color:var(--dim)}
.pv small{font-size:12.5px;color:var(--soft);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .acts{display:flex;gap:6px;margin-top:6px}
.pv .acts span{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:800;background:var(--glass);border:1px solid var(--line)}
.pv .acts span:first-child{background:var(--teal);border-color:var(--teal);color:#062022}
.pv .acts svg{width:13px;height:13px;stroke-width:2.2}

/* steps */
.panel{border-radius:26px;background:rgba(16,22,27,.72);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:18px;display:grid;gap:18px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:relative}
.step{display:grid;justify-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--dim);font-size:11px;font-weight:800;text-align:center}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.18);font-size:12.5px;transition:.35s;background:rgba(0,0,0,.2)}
.step.done .n{background:rgba(31,198,192,.18);border-color:var(--teal);color:var(--teal)}
.step.on{color:var(--fg)}
.step.on .n{background:var(--grad);border-color:transparent;color:#081416;box-shadow:0 0 0 5px rgba(31,198,192,.14)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:25%;background:var(--grad);border-radius:4px;transition:width .5s cubic-bezier(.3,1.2,.5,1)}
[dir="rtl"] .bar{transform:none}

.pane{display:grid;gap:14px;animation:paneIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes paneIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
[dir="rtl"] .pane{animation-name:paneInR}
@keyframes paneInR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.pane h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.pane .hint{margin:-8px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.fld{display:grid;gap:7px}
.fld label,.fld .lab{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--soft)}
[dir="rtl"] .fld label,[dir="rtl"] .fld .lab{letter-spacing:0;font-size:13px}
.fld .opt{color:var(--dim);font-weight:700}
.inp{width:100%;height:52px;border-radius:15px;border:1px solid var(--line);background:rgba(0,0,0,.28);padding:0 15px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:118px;padding:13px 15px;resize:vertical;line-height:1.55}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:rgba(31,198,192,.6);box-shadow:0 0 0 4px rgba(31,198,192,.1)}
.inp.bad{border-color:rgba(240,128,106,.7);box-shadow:0 0 0 4px rgba(240,128,106,.1)}
.err{color:var(--err);font-size:12.5px;font-weight:700;min-height:0}
.count{font-size:11.5px;color:var(--dim);text-align:end;font-variant-numeric:tabular-nums}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:286px;overflow-y:auto;padding:2px;margin:-2px;scrollbar-width:thin}
.cat{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 11px;border-radius:13px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:700;text-align:start;cursor:pointer;transition:background .2s,border-color .2s,transform .15s;line-height:1.25}
.cat:active{transform:scale(.97)}
.cat .tk{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);flex:none;display:grid;place-items:center}
.cat[aria-pressed="true"]{border-color:var(--teal);background:rgba(31,198,192,.12)}
.cat[aria-pressed="true"] .tk{background:var(--teal);border-color:var(--teal);color:#062022}
.cat .tk svg{width:11px;height:11px;stroke-width:3.4;opacity:0}
.cat[aria-pressed="true"] .tk svg{opacity:1}
.cities{display:flex;flex-wrap:wrap;gap:8px}
.mapbox{position:relative;height:240px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0e1418}
#map{position:absolute;inset:0;background:#0e1418}
.mapbox::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none;z-index:500}
.maprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.mbtn .i{width:18px;height:18px;color:var(--teal)}
.mbtn:disabled{opacity:.6}
.pinst{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:8px;min-height:1.2em}
.pinst.ok{color:var(--teal)}.pinst.bad{color:var(--err)}
.pinI{background:none;border:0}
.pinI span{display:block;width:30px;height:30px;margin:2px 0 0 2px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,var(--teal),var(--coral));border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pinI span::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff}
.leaflet-container{font:inherit;background:#0e1418}
.darkt{filter:brightness(.88) saturate(.9)}
.leaflet-control-attribution{background:rgba(11,16,20,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--soft)!important}
.leaflet-bar a{background:#141c21!important;color:var(--fg)!important;border-color:var(--line)!important}
.city{padding:10px 15px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.city[aria-pressed="true"]{background:var(--fg);color:#0b1014;border-color:var(--fg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:15px;background:var(--glass);border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:700}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tg{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:.25s}
.switch .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.switch input:checked + .tg{background:var(--teal)}
.switch input:checked + .tg::after{transform:translateX(18px)}
.switch input:focus-visible + .tg{outline:2px solid var(--teal);outline-offset:3px}

.nfc{border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:14px;display:grid;gap:14px;transition:border-color .3s,background .3s}
.nfc.on{border-color:rgba(31,198,192,.55);background:rgba(31,198,192,.07)}
.nfc .row1{display:flex;align-items:center;gap:14px}
.mini{position:relative;width:118px;height:74px;flex:none;border-radius:11px;padding:1.2px;background:var(--grad);transform:rotate(-5deg);box-shadow:0 12px 26px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.nfc.on .mini{transform:rotate(0) scale(1.04)}
.mini>div{width:100%;height:100%;border-radius:10px;background:radial-gradient(90px 60px at 100% 0%,rgba(31,198,192,.2),transparent 70%),#0e1418;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.mini .mtop{display:flex;justify-content:space-between;align-items:flex-start;direction:ltr}
.mini .mtop svg.logo{width:40px;height:auto}
.mini .mtop svg.i{width:13px;height:13px;color:var(--muted)}
.mini b{font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nfc .txt{flex:1;min-width:0;display:grid;gap:3px}
.nfc .txt b{font-size:15px}
.nfc .txt small{font-size:12.5px;color:var(--muted);line-height:1.45}
.nfc .more{display:grid;gap:12px}
.qty{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.qty button{height:44px;border-radius:13px;border:1px solid var(--line);background:var(--glass);font-weight:800;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.qty button[aria-pressed="true"]{background:var(--fg);color:#0b1014;border-color:var(--fg)}
.nfc .note{font-size:12.5px;color:var(--soft);line-height:1.5;display:flex;gap:8px}
.nfc .note svg{width:16px;height:16px;color:var(--teal);margin-top:1px}
.review{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:2px 14px;display:flex;flex-direction:column}
.rv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}
.rv:last-child{border-bottom:0}
.rv span:first-child{color:var(--muted);font-weight:600;flex:none}
.rv span:last-child{font-weight:700;text-align:end;min-width:0;overflow-wrap:anywhere}

.nav{display:flex;gap:10px}
.btn{height:54px;border-radius:16px;border:0;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.main{flex:1;background:var(--grad);color:#081416}
.btn.main:disabled{opacity:.6;cursor:progress}
.btn.ghost{width:54px;flex:none;background:var(--glass);border:1px solid var(--line);color:var(--fg)}
.btn svg{width:19px;height:19px;stroke-width:2.2}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(8,20,22,.25);border-top-color:#081416;animation:spin .8s linear infinite}

/* success */
.done{display:grid;justify-items:center;gap:12px;text-align:center;padding:10px 4px 4px}
.burst{position:relative;width:120px;height:120px;display:grid;place-items:center;margin-bottom:4px}
.burst .r{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(31,198,192,.6);animation:ring 2.2s cubic-bezier(.2,.7,.2,1) infinite}
.burst .r:nth-child(2){animation-delay:.7s}
@keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.burst .ok{width:74px;height:74px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#081416;animation:popin .6s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 10px 40px rgba(31,198,192,.35)}
.burst .ok svg{width:34px;height:34px;stroke-width:3}
@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.done h2{margin:0;font-size:24px;font-weight:800}
.done p{margin:0;color:var(--soft);font-size:14.5px;line-height:1.6;max-width:34ch}
.done .btns{display:grid;gap:10px;width:100%;margin-top:8px}
.done .btn.alt{background:var(--glass);border:1px solid var(--line);color:var(--fg);text-decoration:none}

.foot{display:grid;justify-items:center;gap:12px;margin-top:4px}
.help{font-size:13px;color:var(--soft);text-align:center}
.help a{color:var(--teal);font-weight:800;text-decoration:none}
.powered{display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:99px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);text-decoration:none}
.powered span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.16em}
[dir="rtl"] .powered span{letter-spacing:0;font-size:12px}
.powered svg{width:62px;height:26px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== v2: solid light fields ===== */
.fld label,.fld .lab{color:#fff;font-size:12.5px}
.fld>label::after,.fld>.lab::after{content:"*";color:var(--coral);margin-inline-start:4px}
.nfc .fld>label::after,.nfc .fld>.lab::after,.fld>.lab[data-t="reviewLab"]::after{content:none}
.inp{height:56px;background:#f4f6f7;border:2px solid #f4f6f7;border-radius:16px;color:#0b1014;font-weight:700;caret-color:#0f8f8a}
textarea.inp{height:auto;min-height:104px;padding-top:13px;line-height:1.5}
.inp::placeholder{color:#7d898f;font-weight:500}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 5px rgba(31,198,192,.35);background:#fff}
.inp.bad{border-color:var(--coral);box-shadow:0 0 0 5px rgba(240,128,106,.3)}
.cat{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3)}
.cat[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#062022}
.cat[aria-pressed="true"] .tk{background:#062022;border-color:#062022;color:var(--teal)}
.city{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3)}
.switch{border:1.5px solid rgba(255,255,255,.3)!important;background:rgba(255,255,255,.1)!important}
/* category search + more */
.csearch{position:relative}
.csearch svg{position:absolute;inset-inline-start:15px;top:50%;width:19px;height:19px;margin-top:-9.5px;color:#7d898f;pointer-events:none}
.csearch .inp{padding-inline-start:44px;height:50px;font-size:15px}
.cats{max-height:none;overflow:visible}
.cat.more{grid-column:1 / -1;justify-content:center;background:transparent;border-style:dashed;color:var(--teal)}
.catnone{grid-column:1 / -1;font-size:13px;color:var(--soft);padding:6px 2px}
/* +964 phone */
.tel{display:flex;align-items:stretch;direction:ltr}
.tel .cc{display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:16px 0 0 16px;background:#dfe5e8;color:#0b1014;font-weight:800;font-size:16px;border:2px solid #dfe5e8;border-inline-end:0}
.tel .cc i{font-style:normal;font-size:17px}
.tel .inp{border-radius:0 16px 16px 0;letter-spacing:.04em}
/* big locate button */
.locbig{width:100%;height:54px;border-radius:16px;border:0;background:var(--grad);color:#081416;font:inherit;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;margin-bottom:10px}
.locbig .i{width:21px;height:21px;color:#081416}
.locbig:disabled{opacity:.6}
.ormap{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;margin:-2px 0 8px}
/* description idea chips */
.ideas{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;align-items:center}
.ideas small{font-size:12px;font-weight:700;color:var(--muted);width:100%}
.idea{padding:8px 12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:var(--fg);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.idea::before{content:"+ ";color:var(--teal)}
.idea[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#062022}
.idea[aria-pressed="true"]::before{content:"✓ ";color:#062022}
/* time left */
.stepinfo{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:9px}
.stepinfo b{color:var(--teal);font-weight:800}
/* success */
.done .promise{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(31,198,192,.1);border:1px solid rgba(31,198,192,.4);font-size:14px;font-weight:700;color:var(--fg);text-align:start;width:100%}
.done .promise svg{width:24px;height:24px;flex:none;color:var(--teal)}
.done .btn.share{background:#fff;color:#0b1014}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld label{font-size:11.5px;line-height:1.35}
.fld.optfld>label::after{content:none}
.fld .opt{color:var(--muted);font-weight:700;letter-spacing:0;text-transform:none}
.preview{display:none!important}
.perks{gap:6px 18px}
.perk{padding:0;background:none;border:0;border-radius:0;font-size:13.5px;font-weight:700;color:var(--soft);cursor:default}
.perk svg{width:16px;height:16px}
/* intro */
.start{display:none;flex-direction:column;align-items:center;gap:16px;padding:26px 0 10px}
body.intro .start{display:flex}
body.intro .panel{display:none}
body:not(.intro) .hero{display:none}
.startbtn{position:relative;width:208px;height:208px;border-radius:50%;border:0;background:#fff;color:#0b1014;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;font:inherit;box-shadow:0 22px 60px rgba(0,0,0,.45),0 0 0 8px rgba(255,255,255,.08);transition:transform .2s}
.startbtn:active{transform:scale(.96)}
.startbtn b{font-size:19px;font-weight:800;line-height:1.25;max-width:150px;text-align:center}
.startbtn .i{width:34px;height:34px;color:#0f8f8a;stroke-width:2.6}
[dir=rtl] .startbtn .i{transform:scaleX(-1)}
.startbtn .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(31,198,192,.7);animation:sp 2.6s ease-out infinite;pointer-events:none}
.startbtn .pulse.p2{animation-delay:1.3s;border-color:rgba(240,128,106,.6)}
@keyframes sp{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.start small{font-size:13px;font-weight:700;color:var(--muted)}
body:not(.intro) .panel{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.startbtn .pulse{animation:none}}
.langs .thumb{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.langs button[aria-pressed="true"]{color:#0b1014}
.step.on .n{background:#fff;border-color:#fff;color:#0b1014;box-shadow:0 0 0 5px rgba(255,255,255,.14)}
/* all action buttons solid white */
.btn.main,.btn.ghost,.btn.alt,.btn.share,.locbig,.mbtn{background:#fff!important;color:#0b1014!important;border:0!important;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn.main:disabled{opacity:.7}
.locbig .i,.mbtn .i,.btn svg{color:#0b1014!important}
.btn.ghost{box-shadow:0 0 0 1px rgba(255,255,255,.2)}
/* RTL: progress fills from the right */
[dir=rtl] .bar i{margin-left:auto;margin-right:0;background:linear-gradient(240deg,var(--teal),var(--coral))}
</style>

    const lines = ['New business registration for Bmnassa:', '', 'Business name: ' + params.get('name'), 'Category: ' + params.get('category'), params.get('owner') && 'Owner: ' + params.get('owner'), 'Phone: ' + phone, wa && 'WhatsApp: ' + wa, 'City: ' + params.get('city'), params.get('address') && 'Address / neighborhood: ' + params.get('address'), order && '>> ' + order, S.desc.trim() && 'Description: ' + S.desc.trim()].filter(Boolean);
    const a = document.createElement('a'); a.href = 'https://wa.me/' + TEAM_WA + '?text=' + encodeURIComponent(lines.join('\n')); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  }
  await Promise.race([dbSave, new Promise(r => setTimeout(r, 6000))]);
  const sp = $('spin'); if (sp) sp.remove(); btn.disabled = false;
  const t = L(); $('doneTitle').textContent = fallback ? t.fbTitle : t.okTitle; $('doneText').textContent = fallback ? t.fbText : t.okText;
  $('form').hidden = true; $('stepsWrap').hidden = true; $('done').hidden = false;
  if (!fallback) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  $('panel').scrollIntoView({behavior: 'smooth', block: 'start'});
}
$('againBtn').onclick = () => { $('catSearch').value = ''; catAll = false; Object.assign(S, {name:'', cat:'', other:'', owner:'', phone:'', same:true, wa:'', city:'', addr:'', desc:'', nfc:false, qty:1, cardName:'', lat:null, lng:null, bldg:'', apt:''}); saveDraft(); step = 0; syncInputs(); syncPin(true); renderStatic(); $('done').hidden = true; $('form').hidden = false; $('stepsWrap').hidden = false; };

/* ---------- map pin ---------- */
const CITY_LL = {erbil:[36.1912,44.0092], sulaymaniyah:[35.5613,45.4366], kirkuk:[35.4681,44.3922], duhok:[36.8669,42.9503], halabja:[35.1779,45.9862]};
let LF = null, map = null, pin = null, leafletP = null, mapFailed = false;
const mapLink = () => S.lat != null ? `https://maps.google.com/?q=${S.lat},${S.lng}` : '';
function loadLeaflet(){
  if (leafletP) return leafletP;
  const SRC = [['/register/leaflet/leaflet.css', '/register/leaflet/leaflet.js'], ['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js']];
  const tryLoad = i => new Promise((res, rej) => {
    if (i >= SRC.length) return rej(new Error('leaflet'));
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = SRC[i][0]; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = SRC[i][1];
    js.onload = () => { if (!window.L) return tryLoad(i + 1).then(res, rej); LF = window.L.noConflict ? window.L.noConflict() : window.L; res(LF); };
    js.onerror = () => tryLoad(i + 1).then(res, rej); document.head.appendChild(js);
  });
  leafletP = tryLoad(0);
  return leafletP;
}
function initMap(){
  if (map) { setTimeout(() => map.invalidateSize(), 60); return; }
  loadLeaflet().then(() => {
    if (map) return;
    const start = S.lat != null ? [S.lat, S.lng] : (CITY_LL[S.city] || [36.0, 44.6]);
    map = LF.map('map', {zoomControl: true, attributionControl: true}).setView(start, S.lat != null ? 16 : (S.city ? 12 : 7));
    const TILES = [['https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, className: 'darkt', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}],
                   ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, className: 'darkt', attribution: 'Tiles &copy; Esri'}]];
    let ti = 0, bad = 0, good = 0, layer = null;
    const useTiles = i => { if (layer) layer.remove(); bad = good = 0; layer = LF.tileLayer(TILES[i][0], TILES[i][1]).addTo(map);
      layer.on('tileload', () => good++); layer.on('tileerror', () => { if (++bad >= 3 && !good && ti < TILES.length - 1) useTiles(++ti); }); };
    useTiles(0);
    map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    map.on('click', e => setPin(e.latlng.lat, e.latlng.lng, false));
    syncPin(false);
    setTimeout(() => map.invalidateSize(), 60);
  }).catch(() => { $('mapbox').hidden = true; mapFailed = true; });
}
function centerOnCity(){ if (map && S.lat == null && CITY_LL[S.city]) map.flyTo(CITY_LL[S.city], 12, {duration: .8}); }
function setPin(lat, lng, fly){
  S.lat = +lat.toFixed(6); S.lng = +lng.toFixed(6); saveDraft(); $('ePin').textContent = '';
  if (map && fly) map.flyTo([S.lat, S.lng], 16, {duration: .8});
  syncPin(false); renderReview();
}
function syncPin(reset){
  if (reset && map) map.setView([36.0, 44.6], 7);
  const t = L(), st = $('pinSt');
  if (map) {
    if (S.lat != null) {
      if (!pin) { pin = LF.marker([S.lat, S.lng], {draggable: true, icon: LF.divIcon({className: 'pinI', html: '<span></span>', iconSize: [36, 40], iconAnchor: [17, 38]})}).addTo(map);
        pin.on('dragend', () => { const p = pin.getLatLng(); setPin(p.lat, p.lng, false); }); }
      else pin.setLatLng([S.lat, S.lng]);
    } else if (pin) { pin.remove(); pin = null; }
  }
  $('pinClear').hidden = S.lat == null;
  st.className = 'pinst' + (S.lat != null ? ' ok' : '');
  if (S.lat != null) { st.textContent = '✓ ' + t.pinOk + ' · '; const c = document.createElement('bdi'); c.dir = 'ltr'; c.textContent = S.lat.toFixed(5) + ', ' + S.lng.toFixed(5); st.appendChild(c); } else st.textContent = t.pinHint;
}
$('pinClear').addEventListener('click', () => { S.lat = S.lng = null; saveDraft(); syncPin(false); renderReview(); });
$('pinMe').addEventListener('click', () => {
  const t = L(), b = $('pinMe'), st = $('pinSt');
  if (!navigator.geolocation) { st.className = 'pinst bad'; st.textContent = t.pinErr; return; }
  b.disabled = true; st.className = 'pinst'; st.textContent = t.pinWait;
  const ok = p => { b.disabled = false; initMap(); loadLeaflet().then(() => setPin(p.coords.latitude, p.coords.longitude, true)); };
  const no = e => { b.disabled = false; st.className = 'pinst bad'; st.textContent = e && e.code === 1 ? t.pinDenied : t.pinErr; };
  navigator.geolocation.getCurrentPosition(ok, e => {
    if (e && e.code === 1) return no(e);
    navigator.geolocation.getCurrentPosition(ok, no, {enableHighAccuracy: false, timeout: 15000, maximumAge: 300000});
  }, {enableHighAccuracy: true, timeout: 9000, maximumAge: 60000});
});

/* ---------- language ---------- */
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return; lang = b.dataset.lang; try { localStorage.setItem('bmnassa-card-lang', lang); } catch (e) {}
  const page = $('page'); page.classList.add('swap');
  setTimeout(() => { renderStatic(); if (!$('done').hidden) { /* keep success text in new language */ const t = L(); $('doneTitle').textContent = t.okTitle; $('doneText').textContent = t.okText; } page.classList.remove('swap'); }, 220);
}));

syncInputs(); renderStatic();
})();
