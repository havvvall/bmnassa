<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bmnassa — every trusted service in Kurdistan</title>
<meta name="description" content="Bmnassa: find trusted services near you in Kurdistan, call or WhatsApp in one tap, and keep every business card in one wallet.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Vazirmatn:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
.bm.lang-ku, .bm.lang-ku * { font-family: Vazirmatn, system-ui, sans-serif !important; }
.cd-front, .cd-front * { text-align: start; }
.cd-front .nm, .cd-front b { font-family: Vazirmatn, system-ui, sans-serif; line-height: 1.5; }
.cd-front small, .cd-front .role { line-height: 1.6; }

.t-en{display:none}.lang-en .t-en{display:inline}.lang-en .t-ku{display:none}.lang-ku .t-ku{display:inline}.lang-ku .t-en{display:none}.lang-sw{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,0.08);margin-inline-end:10px}.lang-sw button{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:800;color:#c4c4ca;background:transparent;cursor:pointer}.lang-sw button.on{background:#f5c33b;color:#15171a}.bm.lang-ku h1, .bm.lang-ku h2, .bm.lang-ku h3, .bm.lang-ku .cta h2 { letter-spacing: 0 !important; line-height: 1.32 !important; }.bm.lang-ku h1 { font-size: clamp(34px, 9vw, 64px) !important; }.bm.lang-ku .step h2, .bm.lang-ku .owners-h h2 { font-size: clamp(30px, 4vw, 60px) !important; }.bm.lang-ku .cta h2 { font-size: clamp(34px, 5vw, 70px) !important; }.bm.lang-ku .step p, .bm.lang-ku .tile p, .bm.lang-ku .lead, .bm.lang-ku .say p { line-height: 1.9 !important; }.bm.lang-ku .tile h3 { font-size: 22px !important; line-height: 1.5 !important; }.bm.lang-ku .lang-sw button, .bm.lang-ku .pill, .bm.lang-ku .store b, .bm.lang-ku .store small { font-family: Vazirmatn, system-ui, sans-serif !important; }.bm.lang-ku .hero-copy h1 em { font-style: normal; }

body { margin: 0; background: #000; }
a { color: #f5c33b; } a:hover { color: #ffd968; }
.bm { --gold: #f5c33b; --ink: #0e0e0f; --muted: #98989f; --panel: #141416; --line: rgba(255,255,255,0.08); font-family: Manrope, system-ui, sans-serif; color: #fff; background: #000; overflow-x: clip; }
.bm *, .bm *::before, .bm *::after { box-sizing: border-box; }
.ku { font-family: Vazirmatn, Manrope, sans-serif; }
/* top bar */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; gap: 24px; padding: 18px clamp(20px, 4vw, 56px); background: linear-gradient(#000 0%, rgba(0,0,0,0.6) 70%, transparent); }
.nav-links { display: flex; gap: 28px; margin-inline-start: auto; }
.nav-links a { color: #d6d6db; text-decoration: none; font-weight: 700; font-size: 15px; }
.nav-links a:hover { color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; background: var(--gold); color: #141414; font-weight: 800; font-size: 15px; text-decoration: none; }
.pill:hover { color: #141414; background: #ffd25a; }
/* hero */
.hero { position: relative; min-height: max(680px, 100vh); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; padding: 96px clamp(20px, 5vw, 80px) 120px; gap: 24px; }
.hero-glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 55% at 72% 46%, rgba(245,195,59,0.16), rgba(245,195,59,0.03) 55%, transparent 75%); }
.stage { position: relative; height: max(560px, 86vh); perspective: 1350px; display: flex; align-items: center; justify-content: center; }
.hero { overflow: hidden; }
.hero > .stage { z-index: 1; }
.sky { z-index: 0; }
/* the 3D view is wider and taller than its column so no card is ever cut; it fades out softly at the top and bottom */
.gl { position: absolute; top: -14vh; left: -40%; width: 180%; height: calc(100% + 28vh); display: block; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 70%, transparent 94%); mask-image: linear-gradient(to bottom, transparent 0%, #000 16%, #000 70%, transparent 94%); }
.stage.webgl .stage-in { display: none; }
.stage-in { position: relative; width: min(340px, 72vw); aspect-ratio: 1.5925; transform-style: preserve-3d; }
.cd { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.cd-l { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; }
.cd-mid { background: #6b6b70; }
.cd-front, .cd-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: inset 0 1px 1px rgba(255,255,255,0.16); }
.cd-front { transform: translateZ(2.6px); padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
.cd-back { transform: translateZ(-2.6px) rotateX(180deg); display: flex; align-items: center; justify-content: center; gap: 18px; }
.cd-grain { position: absolute; inset: 0; opacity: 0.18; mix-blend-mode: overlay; background-image: radial-gradient(rgba(255,255,255,0.55) 0.45px, transparent 0.55px), radial-gradient(rgba(0,0,0,0.5) 0.45px, transparent 0.55px); background-size: 2px 2px, 3px 3px; background-position: 0 0, 1px 1px; pointer-events: none; }
/* light on the card: a shade that darkens it as it turns away, and a soft shine that slides across */
.cd-shade, .cd-sheen { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; }
.cd-sheen { mix-blend-mode: screen; }
.cd-front .nm { text-shadow: 0 1px 0 rgba(0,0,0,0.35), 0 -1px 0 rgba(255,255,255,0.10); }
.cd-mark { position: absolute; right: -6%; top: -18%; width: 62%; opacity: 0.07; pointer-events: none; }
.cd-tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #141414; background: linear-gradient(120deg, #b98208 0%, #f2c445 calc(var(--sh, 40%) - 20%), #fff4cc var(--sh, 40%), #f2c445 calc(var(--sh, 40%) + 16%), #c68f0e 100%); box-shadow: 0 6px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -1px 0 rgba(0,0,0,0.25); }
.cd-icons { display: flex; gap: 6px; }
.cd-ic { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; }
/* the Bmnassa wallet look: cards stacked like a rolodex, a gold ring around the chosen one */
.stage.wallet .stage-in { width: min(400px, 84vw); }
.stage.wallet .cd-front { box-shadow: 0 12px 30px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.16); }
.cd.on .cd-front { box-shadow: 0 0 0 1px rgba(245,195,59,0.6), 0 26px 64px rgba(0,0,0,0.75), 0 0 46px rgba(245,195,59,0.2), inset 0 1px 1px rgba(255,255,255,0.16); }
.cd-dim { position: absolute; inset: 0; background: #0b0b0c; opacity: 0; pointer-events: none; border-radius: 18px; }
.ring { position: absolute; left: -14px; top: -14px; width: calc(100% + 28px); height: calc(100% + 28px); overflow: visible; pointer-events: none; transform: translateZ(-2px); filter: drop-shadow(0 0 4px rgba(245,195,59,0.9)) drop-shadow(0 0 14px rgba(245,195,59,0.45)); }
.ring rect { fill: none; stroke: #f5c33b; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 30 20; animation: orbit 9s linear infinite; }
.ring rect.b { stroke-dasharray: 8 42; animation-duration: 6s; animation-direction: reverse; opacity: 0.7; }
@keyframes orbit { to { stroke-dashoffset: -500; } }
.wglow { position: absolute; left: 50%; top: 50%; width: 130%; height: 170%; transform: translate(-50%, -50%) translateZ(-300px); border-radius: 50%; background: radial-gradient(closest-side, rgba(245,195,59,0.22), rgba(245,195,59,0.05) 60%, transparent); pointer-events: none; }
.wdots { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.wdots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(244,245,247,0.28); transition: height 260ms ease, background 260ms ease; }
.wdots i.on { height: 18px; background: #f5c33b; box-shadow: 0 0 8px rgba(245,195,59,0.8); }
.wbar { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); width: min(400px, 84vw); display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px; border-radius: 999px; background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 300; }
.wbar b { font-size: 16px; } .wbar small { display: block; font-size: 12px; font-weight: 600; color: rgba(244,245,247,0.6); }
.wtag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; margin-inline-start: 8px; border-radius: 999px; background: rgba(245,195,59,0.16); color: #f5c33b; font-size: 11px; font-weight: 800; vertical-align: 2px; }
.wbtn { width: 46px; height: 46px; flex: none; border-radius: 23px; display: grid; place-items: center; }
@media (max-width: 900px) { .wdots { right: -22px; } .wbar { bottom: 2%; } }
.hero-copy h1 { margin: 18px 0 0; font-size: clamp(42px, 5.6vw, 84px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; }
.hero-copy h1 em { font-style: normal; color: var(--gold); }
.lead { margin: 22px 0 0; max-width: 520px; color: #c4c4ca; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.55; font-weight: 500; }
.kicker { display: inline-flex; align-items: center; gap: 10px; color: var(--gold); font-size: 13px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
.kicker i { width: 28px; height: 2px; border-radius: 2px; background: var(--gold); }
.stores { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.store { display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 22px 10px 16px; border-radius: 18px; background: #fff; color: #0e0e0f; text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
.store:hover { color: #0e0e0f; transform: translateY(-2px); }
.store.dark { background: #161618; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
.store.dark:hover { color: #fff; }
.store small { display: block; font-size: 11px; font-weight: 700; opacity: 0.7; }
.store b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.langs { margin-top: 18px; color: var(--muted); font-size: 14px; font-weight: 600; }
.sky { position: absolute; left: 0; right: 0; bottom: 0; height: clamp(110px, 16vw, 210px); overflow: hidden; pointer-events: none; opacity: 0.9; direction: ltr; }
.sky::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #000, transparent 10%, transparent 90%, #000), linear-gradient(transparent 55%, #000); }
.sky-pan { display: flex; height: 100%; width: max-content; animation: skypan 120s linear infinite; }
.sky-pan img { height: 100%; width: auto; display: block; flex: none; }
@keyframes skypan { to { transform: translateX(-50%); } }
.scrollhint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #bdbdc3; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.scrollhint span { width: 24px; height: 38px; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35); position: relative; }
.scrollhint span::after { content: ""; position: absolute; left: 50%; top: 8px; width: 4px; height: 8px; margin-left: -2px; border-radius: 2px; background: var(--gold); animation: wheel 1.8s ease-in-out infinite; }
@keyframes wheel { 60% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }
/* big statement */
.say { padding: 18vh clamp(20px, 6vw, 96px); display: flex; flex-direction: column; gap: 6vh; }
.say p { margin: 0; font-size: clamp(38px, 6.4vw, 104px); line-height: 1.02; font-weight: 800; letter-spacing: -0.04em; }
.say p:nth-child(2) { text-align: end; }
.say p em { font-style: normal; color: var(--gold); }
.say .ku { letter-spacing: 0; font-size: clamp(30px, 4.6vw, 72px); line-height: 1.4; color: #8e8e95; text-align: center; }
/* story: sticky phone + changing words */
.story { position: relative; height: 560vh; }
.story-in { position: sticky; top: 0; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 32px; padding: 72px clamp(20px, 6vw, 96px) 40px; }
.steps { position: relative; height: 360px; }
.step { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; opacity: 0; }
.step h2 { margin: 0; font-size: clamp(38px, 4.8vw, 76px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; }
.step h2 em { font-style: normal; color: var(--gold); }
.step p { margin: 0; max-width: 470px; color: #c4c4ca; font-size: clamp(16px, 1.4vw, 19px); line-height: 1.6; font-weight: 500; }
.num { color: var(--gold); font-weight: 800; font-size: 14px; letter-spacing: 0.18em; }
.dots { display: flex; gap: 8px; margin-top: 30px; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22); transition: width 300ms ease, background 300ms ease; }
.dots i.on { width: 28px; background: var(--gold); }
.phone-wrap { display: flex; justify-content: center; perspective: 1600px; }
.phone { position: relative; width: min(330px, 70vw); aspect-ratio: 390 / 844; border-radius: 52px; padding: 11px; background: #0b0b0c; box-shadow: 0 0 0 2px #2a2b2e, 0 40px 90px rgba(0,0,0,0.7), 0 0 120px rgba(245,195,59,0.10); will-change: transform; }
.phone-scr { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #000; }
.phone-scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; will-change: opacity, transform; }
.notch { position: absolute; top: 20px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #0b0b0c; z-index: 3; }
/* owners */
.owners { padding: 16vh clamp(20px, 5vw, 80px) 12vh; }
.owners-h { max-width: 900px; }
.owners-h h2 { margin: 16px 0 0; font-size: clamp(36px, 5vw, 80px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; }
.owners-h h2 em { font-style: normal; color: var(--gold); }
.bento { margin-top: 56px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.tile { position: relative; border-radius: 32px; background: var(--panel); padding: 30px; overflow: hidden; min-height: 300px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.tile h3 { margin: 0; font-size: 26px; letter-spacing: -0.02em; font-weight: 800; }
.tile p { margin: 0; color: #a9a9b0; font-size: 16px; line-height: 1.55; font-weight: 500; max-width: 360px; }
.tile.big { grid-row: span 2; }
.tile.gold { background: linear-gradient(160deg, #f8d064, #e0a614); color: #141414; box-shadow: none; }
.tile.gold p { color: #3d3210; }
.tile-shot { margin-top: auto; align-self: center; width: 72%; border-radius: 26px 26px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); margin-bottom: -30px; }
.ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: rgba(245,195,59,0.12); color: var(--gold); margin-bottom: 8px; }
.tile.gold .ic { background: rgba(20,20,20,0.12); color: #141414; }
.swatches { display: flex; gap: 10px; margin-top: auto; }
.swatches i { width: 34px; height: 34px; border-radius: 17px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18); }
/* final call */
.cta { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 20px 260px; overflow: hidden; }
.cta-glow { position: absolute; left: 50%; top: 40%; width: 1100px; height: 900px; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(245,195,59,0.22), rgba(245,195,59,0.04) 60%, transparent); pointer-events: none; }
.cta h2 { position: relative; margin: 34px 0 0; font-size: clamp(40px, 6vw, 96px); line-height: 1; letter-spacing: -0.04em; font-weight: 800; }
.cta h2 em { font-style: normal; color: var(--gold); }
.cta .stores { justify-content: center; position: relative; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding: 28px clamp(20px, 5vw, 80px); color: #7d7d84; font-size: 14px; font-weight: 600; border-top: 1px solid var(--line); }
@media (max-width: 900px) {
  .nav-links { display: none; }
  .nav .pill { margin-inline-start: auto; }
  .hero { grid-template-columns: minmax(0, 1fr); padding-top: 84px; gap: 0; }
  .stage { height: 58vh; min-height: 420px; order: -1; }
  .hero-copy { text-align: center; }
  .hero-copy .lead { margin-inline: auto; }
  .stores { justify-content: center; }
  .story-in { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; align-content: start; gap: 10px; padding-top: 76px; }
  .steps { height: 210px; }
  .step { text-align: center; align-items: center; gap: 10px; }
  .dots { justify-content: center; margin-top: 4px; }
  .phone { width: min(250px, 58vw); }
  .bento { grid-template-columns: minmax(0, 1fr); }
  .tile.big { grid-row: auto; }
  .say p:nth-child(2) { text-align: start; }
}
@media (prefers-reduced-motion: reduce) { .sky-pan, .scrollhint span::after { animation: none; } }

</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="bm {{langCls}}" dir="{{dir}}" ref="{{setRoot}}">

  <header class="nav">
    <div class="lang-sw" role="group" aria-label="Language"><button type="button" class="{{enCls}}" aria-pressed="{{enOn}}" onClick="{{setEn}}">English</button><button type="button" class="{{kuCls}}" aria-pressed="{{kuOn}}" onClick="{{setKu}}">کوردی</button></div>
    <img src="assets/logo.svg" alt="Bmnassa" style="height: 26px; width: auto; display: block">
    <nav class="nav-links" aria-label="Sections">
      <a href="#how"><span class="t-ku">چۆن کار دەکات</span><span class="t-en">How it works</span></a>
      <a href="#owners"><span class="t-ku">بۆ بزنسەکان</span><span class="t-en">For businesses</span></a>
    </nav>
    <a class="pill" href="#download"><span class="t-ku">ئەپەکە دابگرە</span><span class="t-en">Get the app</span></a>
  </header>

  <section class="hero">
    <div class="hero-glow"></div>
    <div class="hero-copy" data-rv="in" style="position: relative; z-index: 2">
      <span class="kicker"><i></i>Kurdistan · Iraq</span>
      <h1><span class="t-ku">هەموو خزمەتگوزارییەکی متمانەپێکراو، <em>بە یەک گەڕان نزیکە.</em></span><span class="t-en">Every trusted service, <em>one tap away.</em></span></h1>
      <p class="lead"><span class="t-ku">پلۆمبەر، کارەبایی، چاککردنەوەی کۆڵەر و سەدان کەسی تر لە نزیکتەوە بدۆزەرەوە. بە یەک گەڕان پەیوەندی بکە یان واتساپ بنێرە، و هەموو کارتی بزنسەکان لە یەک جزدان هەڵبگرە.</span><span class="t-en">Find plumbers, electricians, AC repair and hundreds more near you. Call or WhatsApp in one tap, and keep every business card in one wallet.</span></p>
      <div class="stores">
        <a class="store" href="#download" aria-label="ئەپ ستۆر، بۆ ئایفۆن دابگرە">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"></rect><path d="M10.5 18.5h3"></path></svg>
          <span><span class="t-ku"><small>بۆ ئایفۆن دابگرە</small></span><span class="t-en"><small>Download for iPhone</small></span><b>App Store</b></span>
        </a>
        <a class="store dark" href="#download" aria-label="گووگڵ پلەی، بۆ ئەندرۆید وەریبگرە">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5v15l13-7.5z"></path></svg>
          <span><span class="t-ku"><small>بۆ ئەندرۆید وەریبگرە</small></span><span class="t-en"><small>Get it for Android</small></span><b>Google Play</b></span>
        </a>
      </div>
      <div class="langs">Free to download</div>
    </div>

    <div class="stage {{stageCls}}" aria-hidden="true">
      <sc-if value="{{isGL}}" hint-placeholder-val="{{false}}"><canvas class="gl" ref="{{setCanvas}}"></canvas></sc-if>
      <div class="stage-in">
        <sc-if value="{{isWallet}}" hint-placeholder-val="{{true}}">
          <div class="wglow"></div>
          <svg class="ring" viewBox="0 0 428 280" preserveAspectRatio="none"><rect x="1" y="1" width="426" height="278" rx="30"></rect><rect class="b" x="1" y="1" width="426" height="278" rx="30"></rect></svg>
          <div class="wdots"><sc-for list="{{dots}}" as="d" hint-placeholder-count="8"><i data-wdot="1"></i></sc-for></div>
        </sc-if>
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
          <div class="cd" data-card="1">

<script>
window.DCLogic = class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(s) { Object.assign(this.state, s); if (this.onState) this.onState(); }
};
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.root = null;
    this.raf = 0;
    this.t = 0;
    this.mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  }
  qr(seed) {
    // a decorative QR-like pattern: three finder squares and seeded dots
    let d = "";
    const n = 25;
    let s = seed;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const finder = (x, y) => {
      d += "M" + x + " " + y + "h7v7h-7zM" + (x + 1) + " " + (y + 1) + "v5h5v-5zM" + (x + 2) + " " + (y + 2) + "h3v3h-3z";
    };
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      if (!inF && rnd() > 0.52) d += "M" + x + " " + y + "h1v1h-1z";
    }
    return d;
  }
  renderVals() {
    const lang = (this.state && this.state.lang) || "ku";
    const RL = lang === "en" ? "Your Job - Position" : "پیشە - پۆست";
    const C = [
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#14213d", hi: "#2b3f6b", back: "#dfe4ee", ink: "#14213d" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#5a1a2a", hi: "#8a2c41", back: "#efe1e4", ink: "#4a1523" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#1e3a2f", hi: "#2f5a49", back: "#dde8e2", ink: "#1e3a2f" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#3a2350", hi: "#5a3a7a", back: "#e7e0ef", ink: "#3a2350" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#b94e38", hi: "#d9745c", back: "#f6e3dc", ink: "#6e2a1c" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#2c4a63", hi: "#44698a", back: "#dde6ee", ink: "#22394d" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#121212", hi: "#2e2a22", back: "#efe8d8", ink: "#3a2f1a" },
      { name: "XXX", role: RL, letter: "X", handle: "yourname", base: "#4a3a2e", hi: "#6e5644", back: "#ece4dc", ink: "#3d2f25" },
    ];
    if (!this._cards) {
      // the card's edge: its own colour, a little darker, stacked in thin slices so it has real thickness
      const darker = (hex, k) => { const v = parseInt(hex.slice(1), 16); const f = (x) => Math.round(x * (1 - k)); return "rgb(" + f(v >> 16) + "," + f((v >> 8) & 255) + "," + f(v & 255) + ")"; };
      const Z = [-2.2, -1.65, -1.1, -0.55, 0, 0.55, 1.1, 1.65, 2.2];
      this._cards = C.map((c, i) => ({ ...c, front: "linear-gradient(150deg, " + c.hi + " 0%, " + c.base + " 62%)", qr: this.qr(17 + i * 31), layers: Z.map((z) => ({ z: z, bg: darker(c.base, 0.3) })) }));
      this._cards.forEach((c) => { const v = parseInt(c.base.slice(1), 16); c.edgeV = [((v >> 16) & 255) / 255 * 0.72, ((v >> 8) & 255) / 255 * 0.72, (v & 255) / 255 * 0.72]; });
    }
    const want = this.props.heroCards;
    let mode = want === "wallet" ? "wallet" : want === "carousel" ? "carousel" : "webgl";
    if (mode === "webgl" && this.glFail) mode = "carousel";
    this.mode = mode;
    return {
      lang: lang,
      langCls: "lang-" + lang,
      dir: lang === "en" ? "ltr" : "rtl",
      enCls: lang === "en" ? "on" : "",
      kuCls: lang === "ku" ? "on" : "",
      enOn: lang === "en" ? "true" : "false",
      kuOn: lang === "ku" ? "true" : "false",
      setEn: () => this.setState({ lang: "en" }),
      setKu: () => this.setState({ lang: "ku" }),
      isWallet: mode === "wallet",
      isGL: mode === "webgl",
      setCanvas: (el) => { this.canvas = el; },
      stageCls: mode,
      dots: this._cards.map((c, i) => ({ i })),
      cards: this._cards,
      setRoot: (el) => { this.root = el; },
    };
  }
  componentDidMount() {
    this.calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.onMove = (e) => {
      this.mouse.tx = Math.max(-1, Math.min(1, (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2)));
      this.mouse.ty = Math.max(-1, Math.min(1, (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2)));
    };
    this.onLeave = () => { this.mouse.tx = 0; this.mouse.ty = 0; };
    window.addEventListener("mousemove", this.onMove);
    document.addEventListener("mouseleave", this.onLeave);
    const tick = () => { this.frame(); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }

  frame() {
    const root = this.root;
    if (!root) return;
    const vh = window.innerHeight || 800;
    const ss = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

    // 1) the hero: a vertical 3D carousel of Bmnassa cards
    const cards = root.querySelectorAll("[data-card]");
    const stage = root.querySelector(".stage");
    if (this.mode === "webgl") {
      this.glFrame();
    } else if (cards.length && stage && this.mode === "wallet") {
      // the Bmnassa wallet: the cards roll past like a rolodex, the chosen one under a gold ring; every other card turns over to show its QR
      if (!this.calm) this.t += 0.0026;
      const m = this.mouse;
      m.x += (m.tx - m.x) * 0.08; m.y += (m.ty - m.y) * 0.08;
      const n = cards.length, H = cards[0].offsetHeight || 250, GAP = 58;
      const r = Math.round(this.t), df = this.t - r;
      const active = r + Math.sign(df) * Math.pow(Math.abs(df) * 2, 3.2) / 2;
      const front = ((r % n) + n) % n;
      for (let i = 0; i < n; i++) {
        const el = cards[i];
        let d = i - active;
        while (d > n / 2) d -= n;
        while (d < -n / 2) d += n;
        const a = Math.abs(d), near = Math.min(a, 1), cf = Math.max(0, 1 - a);
        if (a > 3.6) { el.style.visibility = "hidden"; continue; }
        el.style.visibility = "visible";
        const ty = d * GAP + (d < 0 ? -near * 14 - Math.max(0, a - 1) * 8 : near * (H * 0.5 + 46) + Math.max(0, a - 1) * 6);
        const rx = (d < 0 ? Math.min(a, 2) * 20 : -Math.min(a, 1.5) * 9) - m.y * 10 * cf;
        const spin = (i === front && r % 2 === 0 && !this.calm) ? 360 * ss(-0.16, 0.16, df) : 0;
        const ry = m.x * 14 * cf + spin;
        const sc = 1 + (1 - near) * 0.04 - a * 0.055;
        el.style.opacity = (1 - ss(2.7, 3.6, a)).toFixed(3);
        el.style.zIndex = a < 0.5 ? "200" : String(d < 0 ? 100 - Math.round(a * 10) : 60 + Math.round(a * 10));
        el.style.transform = "translateY(" + ty.toFixed(1) + "px) translateZ(" + (-a * 50).toFixed(1) + "px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) scale(" + sc.toFixed(4) + ")";
        el.classList.toggle("on", a < 0.5);
        const dim = el.querySelector(".cd-dim");
        if (dim) dim.style.opacity = String(d < 0 ? Math.min(0.62, a * 0.24) : Math.min(0.4, a * 0.1));
        const bk = el.querySelector(".cd-back");
        if (bk) bk.style.transform = "translateZ(-2.6px) rotateY(180deg)";
        this.light(el, rx, ry, 400 - a * 200, a * 0.6);
      }
      root.querySelectorAll("[data-wdot]").forEach((dt, i) => { dt.className = i === front ? "on" : ""; });
    } else if (cards.length && stage) {
      cards.forEach((el) => { el.classList.remove("on"); el.style.opacity = "1"; const bk = el.querySelector(".cd-back"); if (bk) bk.style.transform = "translateZ(-2.6px) rotateX(180deg)"; const dim = el.querySelector(".cd-dim"); if (dim) dim.style.opacity = "0"; });
      if (!this.calm) this.t += 0.0016;
      const m = this.mouse;
      m.x += (m.tx - m.x) * 0.08; m.y += (m.ty - m.y) * 0.08;
      const n = cards.length, cardH = cards[0].offsetHeight || 210, h = stage.clientHeight || vh;
      const r = Math.round(this.t), df = this.t - r;
      // the wheel slows into place, overshoots a touch and settles, like something with weight
      const u = Math.min(1, Math.max(0, (df + 0.18) / 0.62));
      const settle = df > -0.18 && !this.calm ? 0.05 * Math.exp(-u * 4) * Math.sin(u * Math.PI * 3) : 0;
      const active = r + Math.sign(df) * Math.pow(Math.abs(df) * 2, 4.2) / 2 + settle;
      const D = 1350, peek = -40;
      for (let i = 0; i < n; i++) {
        const el = cards[i];
        let off = i - active;
        while (off > n / 2) off -= n;
        while (off < -n / 2) off += n;
        const a = Math.abs(off), sg = Math.sign(off);
        if (a > 3) { el.style.visibility = "hidden"; continue; }
        el.style.visibility = "visible";
        let y = 0, z = 0, rot = 0;
        if (a <= 1) {
          const e = a * a * (3 - 2 * a);
          y = -sg * e * (cardH + 34); z = 400 + e * (220 - 400); rot = e * 132;
        } else if (a <= 2) {
          const t = a - 1, e = t * t * (3 - 2 * t);
          const yEnd = (h / 2 - peek) / (D / (D + 60)) - cardH / 2;
          y = -sg * ((cardH + 34) + e * (yEnd - (cardH + 34))); z = 220 + e * (-60 - 220); rot = 132 + e * 43;
        } else {
          const t = Math.min(a - 2, 1), e = t * t * (3 - 2 * t);
          const y2 = (h / 2 - peek) / (D / (D + 60)) - cardH / 2;
          const y3 = (h / 2 + 100) / (D / (D + 250)) + cardH / 2;
          y = -sg * (y2 + e * (y3 - y2)); z = -60 + e * (-250 + 60); rot = 175 + e * 20;
        }
        const cf = Math.max(0, 1 - a);
        const rx = -sg * rot - m.y * 12 * cf;
        const ry = m.x * 15 * cf;
        el.style.zIndex = String(Math.round(z));
        el.style.transform = "translateY(" + y.toFixed(1) + "px) translateZ(" + z.toFixed(1) + "px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) rotateZ(-3deg)";
        this.light(el, rx, ry, z, a);
      }
    }

    // 2) blocks fade and rise in as they arrive, and fade out as they leave the top
    root.querySelectorAll("[data-rv]").forEach((el) => {
      if (this.calm) { el.style.opacity = "1"; el.style.transform = "none"; return; }
      const b = el.getBoundingClientRect();
      const c = (b.top + b.height / 2 - vh / 2) / (vh / 2 + Math.min(b.height, vh) / 2);
      const comeIn = 1 - ss(0.35, 0.95, c);
      const goOut = el.getAttribute("data-rv") === "in" ? 1 : 1 - ss(-0.55, -1.0, c);
      const o = Math.min(comeIn, goOut);
      const ty = c > 0 ? (1 - comeIn) * 60 : -(1 - goOut) * 40;
      el.style.opacity = o.toFixed(3);
      el.style.transform = "translateY(" + ty.toFixed(1) + "px) scale(" + (0.96 + 0.04 * o).toFixed(4) + ")";
      el.style.filter = o < 0.99 ? "blur(" + ((1 - o) * 8).toFixed(1) + "px)" : "none";
    });

    // 3) the story: the phone stays in place while the words and screens change with the scroll
    const story = root.querySelector("[data-story]");
    if (story) {
      const b = story.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, -b.top / Math.max(1, b.height - vh)));
      const steps = story.querySelectorAll("[data-step]");
      const shots = story.querySelectorAll("[data-screen]");
      const dots = story.querySelectorAll("[data-dot]");
      const N = steps.length, f = p * N;
      for (let i = 0; i < N; i++) {
        const k = f - i - 0.5;
        const o = this.calm ? (Math.floor(Math.min(f, N - 0.001)) === i ? 1 : 0) : 1 - ss(0.3, 0.5, Math.abs(k));
        const st = steps[i];
        st.style.opacity = o.toFixed(3);
        st.style.transform = "translateY(" + (-k * 70).toFixed(1) + "px)";
        st.style.filter = o < 0.99 ? "blur(" + ((1 - o) * 10).toFixed(1) + "px)" : "none";
        st.style.pointerEvents = o > 0.5 ? "auto" : "none";
        const sh = shots[i];
        if (sh) { sh.style.opacity = o.toFixed(3); sh.style.transform = "scale(" + (1.06 - 0.06 * o).toFixed(4) + ")"; }
        if (dots[i]) dots[i].className = o > 0.5 ? "on" : "";
      }
      const ph = story.querySelector("[data-phone]");
      if (ph && !this.calm) {
        const tilt = Math.sin(p * Math.PI * 4);
        ph.style.transform = "rotateY(" + (tilt * -9).toFixed(2) + "deg) rotateX(" + (4 + this.mouse.y * -3).toFixed(2) + "deg) translateY(" + (Math.cos(p * Math.PI * 4) * 10).toFixed(1) + "px)";
      }
    }
  }
}

</script>
<script src="design-runtime.js"></script>
