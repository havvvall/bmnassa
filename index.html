<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dfe2e6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bmnassa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // set the theme before the first paint so dark mode never flashes silver
      (function () {
        try {
          var c = localStorage.getItem("bm_theme") || "auto";
          var d = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var th = c === "auto" ? (d ? "dark" : "bmnassa") : c;
          document.documentElement.setAttribute("data-theme", th);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", th === "dark" ? "#000000" : th === "light" ? "#f2f2f7" : "#dfe2e6");
        } catch (e) {}
      })();
    </script>
    <title>Bmnassa</title>
    <meta name="description" content="Find trusted services in Kurdistan, in Kurdish, Arabic or English." />
    <link rel="icon" href="/brand/mark-ink.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
